# 주의: 이 레포는 스캐너 워크플로가 없어 SonarCloud Automatic Analysis 로 돈다.
# Automatic Analysis 는 아래 exclusions 를 읽지 않는다(적용 후 재분석 3회로 확인, 신규 이슈 27건 그대로).
# 실제로 끄려면 SonarCloud UI: Project Settings > General Settings > Analysis Scope 에서 설정해야 한다.
# 이 파일은 나중에 스캐너 기반 분석(sonar-scanner / GitHub Action)으로 옮길 때를 위한 것이다.
#
# 테스트 경로를 빼는 이유
#  - swift:S100(함수 네이밍): 테스트 메서드명을 `test_TC{n}_{조건}_{기대결과}` 한글 형식으로 강제한다
#    (docs/process/testing.md). 이 이름이 TC 커버리지 표의 근거라 규칙과 양립할 수 없다.
#  - swift:S1075(하드코딩 URI): AppEnvironmentTests 는 운영/개발 API URL 자체가 검증 대상이다.

sonar.projectKey=3dollar-in-my-pocket_3dollars-in-my-pocket-ios
