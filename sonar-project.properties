# Tuist 생성물·서드파티 체크아웃은 분석 대상이 아니다.
sonar.exclusions=**/Derived/**,Tuist/.build/**,**/*.generated.swift

# 테스트 경로에서만 끄는 규칙
# S100(함수 네이밍): 이 레포는 테스트 메서드명을 `test_TC{n}_{조건}_{기대결과}` 한글 형식으로 강제한다
#   (docs/process/testing.md). 이 이름이 곧 TC 커버리지 표의 근거라 규칙과 양립할 수 없다.
# S1075(하드코딩 URI): AppEnvironmentTests 는 운영/개발 API URL 자체가 검증 대상이라 리터럴이 필요하다.
sonar.issue.ignore.multicriteria=e1,e2

sonar.issue.ignore.multicriteria.e1.ruleKey=swift:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=App/Targets/three-dollar-in-my-pocketTests/**/*

